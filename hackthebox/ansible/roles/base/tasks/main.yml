---
- name: Check target_user was passed by bootstrap.sh
  ansible.builtin.assert:
    that: target_user is defined and target_user | length > 0
    fail_msg: "Run this through: sudo ./bootstrap.sh"

# bootstrap.sh has already refreshed the package lists. Ansible's own refresh would
# fail with a blank error if any single source is unreachable.
- name: Upgrade existing packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ apt_required }}"
    state: present
